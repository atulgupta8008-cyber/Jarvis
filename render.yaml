services:
  - type: web
    name: jarvis-quantum-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r jarvis_system/requirements.txt
    startCommand: uvicorn jarvis_system.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: JARVIS_ALLOWED_ORIGINS
        value: "*"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
